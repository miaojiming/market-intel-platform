// 生成更多 mock 数据用于趋势图
function generateTrendData() {
  const days = [];
  const counts = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push((d.getMonth()+1) + '/' + d.getDate());
    counts.push(Math.floor(Math.random() * 8) + 3);
  }
  return { days, counts };
}

// ==========================================
// 状态与工具函数
// ==========================================
let allItems = [];
let filteredItems = [];

function weightedScore(item) {
  return Math.round((0.4 * item.thailand_relevance + 0.4 * item.opportunity_strength + 0.2 * item.timeliness) * 10) / 10;
}

function scoreClass(score) {
  if (score >= 7) return 'score-high';
  if (score >= 4) return 'score-mid';
  return 'score-low';
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  const now = new Date();
  const diff = Math.floor((now - d) / (1000 * 60 * 60 * 24));
  if (diff === 0) return '今天';
  if (diff === 1) return '昨天';
  if (diff < 7) return diff + ' 天前';
  return dateStr;
}

function daysAgo(dateStr) {
  const d = new Date(dateStr);
  const now = new Date();
  return Math.floor((now - d) / (1000 * 60 * 60 * 24));
}

// ==========================================
// 数据加载：优先 data.json（脚本导出的真实数据），失败用 mock
// ==========================================
async function loadData() {
  let loaded = false;

  // 尝试加载真实导出数据
  try {
    const resp = await fetch('data.json');
    if (resp.ok) {
      const data = await resp.json();
      if (data.items && data.items.length > 0) {
        allItems = data.items;
        loaded = true;
        console.log(`已加载真实数据: ${allItems.length} 条（导出于 ${data.exported_at}）`);
      }
    }
  } catch (e) {
    console.log('未找到 data.json，使用 mock 演示数据');
  }

  // fallback: mock 数据
  if (!loaded) {
    allItems = MOCK_DATA.map(item => ({
      ...item,
      weight_score: weightedScore(item)
    }));
    console.log(`使用演示数据: ${allItems.length} 条`);
  }

  updateLastUpdate();
  applyFilters();
  initCharts();
  updateKPIs();
}

// 飞书多维表格 API 接入（生产用）
async function loadFromBitable() {
  // 需要后端代理，因为前端直接调用会暴露 app_secret
  // 建议方案：加一个简单的 API 代理接口，或使用只读 token
  const APP_TOKEN = 'YOUR_BITABLE_APP_TOKEN';
  const TABLE_ID = 'YOUR_TABLE_ID';
  const TOKEN = 'YOUR_TENANT_ACCESS_TOKEN'; // 需后端获取

  try {
    const resp = await fetch(
      `https://open.feishu.cn/open-apis/bitable/v1/apps/${APP_TOKEN}/tables/${TABLE_ID}/records?page_size=200`,
      { headers: { 'Authorization': `Bearer ${TOKEN}` } }
    );
    const data = await resp.json();
    if (data.code === 0 && data.data && data.data.items) {
      allItems = data.data.items.map(rec => {
        const f = rec.fields;
        return {
          id: rec.record_id,
          title: f['标题'] || '',
          summary_zh: f['内容摘要'] || '',
          thailand_relevance: f['泰国相关度'] || 0,
          opportunity_strength: f['商机强度'] || 0,
          timeliness: f['时效性'] || 0,
          section: f['板块'] || '',
          subsection: f['二级菜单'] || '',
          tags: f['标签'] || [],
          source: f['信息来源'] || '',
          published: f['发布日期'] ? new Date(f['发布日期']).toISOString().split('T')[0] : '',
          link: f['原文链接']?.link || f['原文链接'] || ''
        };
      }).map(item => ({ ...item, weight_score: weightedScore(item) }));
    }
  } catch (e) {
    console.error('加载多维表格失败', e);
  }
}

function updateLastUpdate() {
  const now = new Date();
  const timeStr = now.toLocaleString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  document.getElementById('lastUpdate').textContent = `更新于 ${timeStr}`;
}

// ==========================================
// KPI 卡片
// ==========================================
function updateKPIs() {
  document.getElementById('kpiTotal').textContent = allItems.length;
  document.getElementById('kpiHighValue').textContent = allItems.filter(i => i.weight_score >= 5).length;
  document.getElementById('kpiTender').textContent = allItems.filter(i => i.section === '招标机会').length;
  const sources = new Set(allItems.map(i => i.source));
  document.getElementById('kpiSources').textContent = sources.size;
}

// ==========================================
// 图表
// ==========================================
let chartTrend, chartSection, chartTags;

function initCharts() {
  // 趋势图
  chartTrend = echarts.init(document.getElementById('chartTrend'), null, { renderer: 'svg' });
  const trend = generateTrendData();
  chartTrend.setOption({
    tooltip: { trigger: 'axis' },
    grid: { left: '3%', right: '4%', bottom: '3%', top: '10%', containLabel: true },
    xAxis: {
      type: 'category',
      data: trend.days,
      axisLine: { lineStyle: { color: '#334155' } },
      axisLabel: { color: '#94a3b8' }
    },
    yAxis: {
      type: 'value',
      axisLine: { show: false },
      axisLabel: { color: '#94a3b8' },
      splitLine: { lineStyle: { color: '#1e293b' } }
    },
    series: [{
      name: '采集量',
      type: 'line',
      data: trend.counts,
      smooth: true,
      lineStyle: { color: '#38bdf8', width: 3 },
      areaStyle: {
        color: {
          type: 'linear', x: 0, y: 0, x2: 0, y2: 1,
          colorStops: [
            { offset: 0, color: 'rgba(56, 189, 248, 0.3)' },
            { offset: 1, color: 'rgba(56, 189, 248, 0)' }
          ]
        }
      },
      itemStyle: { color: '#38bdf8' }
    }]
  });

  // 板块分布饼图
  chartSection = echarts.init(document.getElementById('chartSection'), null, { renderer: 'svg' });
  const sections = {};
  allItems.forEach(i => { sections[i.section] = (sections[i.section] || 0) + 1; });
  chartSection.setOption({
    tooltip: { trigger: 'item' },
    legend: { bottom: 0, textStyle: { color: '#94a3b8', fontSize: 11 } },
    series: [{
      type: 'doughnut',
      radius: ['50%', '75%'],
      center: ['50%', '45%'],
      avoidLabelOverlap: false,
      label: { show: false },
      data: [
        { value: sections['行业新闻'] || 0, name: '行业新闻', itemStyle: { color: '#38bdf8' } },
        { value: sections['招标机会'] || 0, name: '招标机会', itemStyle: { color: '#fbbf24' } }
      ]
    }]
  });

  // 标签 TOP8
  chartTags = echarts.init(document.getElementById('chartTags'), null, { renderer: 'svg' });
  const tagCount = {};
  allItems.forEach(i => {
    (i.tags || []).forEach(t => { tagCount[t] = (tagCount[t] || 0) + 1; });
  });
  const tagData = Object.entries(tagCount)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 8)
    .reverse();
  chartTags.setOption({
    tooltip: { trigger: 'axis' },
    grid: { left: '3%', right: '15%', bottom: '3%', top: '3%', containLabel: true },
    xAxis: {
      type: 'value',
      axisLine: { show: false },
      axisLabel: { color: '#94a3b8' },
      splitLine: { lineStyle: { color: '#1e293b' } }
    },
    yAxis: {
      type: 'category',
      data: tagData.map(d => d[0]),
      axisLine: { lineStyle: { color: '#334155' } },
      axisLabel: { color: '#94a3b8', fontSize: 11 }
    },
    series: [{
      type: 'bar',
      data: tagData.map(d => d[1]),
      itemStyle: {
        color: { type: 'linear', x: 0, y: 0, x2: 1, y2: 0,
          colorStops: [
            { offset: 0, color: '#818cf8' },
            { offset: 1, color: '#38bdf8' }
          ]
        },
        borderRadius: [0, 4, 4, 0]
      },
      barWidth: '50%'
    }]
  });

  window.addEventListener('resize', () => {
    chartTrend.resize();
    chartSection.resize();
    chartTags.resize();
  });
}

// ==========================================
// 筛选与渲染
// ==========================================
function applyFilters() {
  const section = document.getElementById('filterSection').value;
  const minScore = parseFloat(document.getElementById('filterMinScore').value);
  const timeRange = document.getElementById('filterTime').value;
  const search = document.getElementById('filterSearch').value.toLowerCase();
  const sortBy = document.getElementById('sortBy').value;

  filteredItems = allItems.filter(item => {
    if (section && item.section !== section) return false;
    if (item.weight_score < minScore) return false;
    if (timeRange !== 'all' && daysAgo(item.published) > parseInt(timeRange)) return false;
    if (search) {
      const haystack = (item.title + item.summary_zh).toLowerCase();
      if (!haystack.includes(search)) return false;
    }
    return true;
  });

  // 排序
  filteredItems.sort((a, b) => {
    switch (sortBy) {
      case 'time': return new Date(b.published) - new Date(a.published);
      case 'relevance': return b.thailand_relevance - a.thailand_relevance;
      case 'opportunity': return b.opportunity_strength - a.opportunity_strength;
      default: return b.weight_score - a.weight_score;
    }
  });

  renderList();
}

function renderList() {
  const list = document.getElementById('intelList');
  document.getElementById('listCount').textContent = `(${filteredItems.length} 条)`;

  if (filteredItems.length === 0) {
    list.innerHTML = '<li class="loading">暂无符合条件的情报</li>';
    return;
  }

  list.innerHTML = filteredItems.map(item => {
    const ws = item.weight_score;
    const cls = scoreClass(ws);
    const sectionCls = item.section === '招标机会' ? 'section-tender' : 'section-news';
    const tagsHtml = (item.tags || []).slice(0, 3).map(t => `<span class="tag">${t}</span>`).join('');

    return `
      <li class="intel-item" onclick="openDetail('${item.id}')">
        <div class="score-badge ${cls}">
          <span class="score-label">权重</span>
          ${ws}
        </div>
        <div class="intel-content">
          <div class="intel-title">${item.title}</div>
          <div class="intel-summary">${item.summary_zh}</div>
          <div class="intel-meta">
            <span class="section-tag ${sectionCls}">${item.section}</span>
            ${tagsHtml}
            <span>${item.source}</span>
            <span>${formatDate(item.published)}</span>
          </div>
        </div>
        <div class="intel-scores">
          <div class="score-row"><span>相关度</span><span class="score-val">${item.thailand_relevance}</span></div>
          <div class="score-row"><span>商机</span><span class="score-val">${item.opportunity_strength}</span></div>
          <div class="score-row"><span>时效</span><span class="score-val">${item.timeliness}</span></div>
        </div>
      </li>
    `;
  }).join('');
}

// ==========================================
// 详情弹窗
// ==========================================
function openDetail(id) {
  const item = allItems.find(i => i.id === id);
  if (!item) return;

  document.getElementById('modalTitle').textContent = item.title;
  document.getElementById('modalWeight').textContent = item.weight_score.toFixed(1);
  document.getElementById('modalRel').textContent = item.thailand_relevance;
  document.getElementById('modalOpp').textContent = item.opportunity_strength;
  document.getElementById('modalTime').textContent = item.timeliness;
  document.getElementById('modalSummary').textContent = item.summary_zh || '—';

  const tagsHtml = (item.tags || []).map(t => `<span class="tag">${t}</span>`).join(' ');
  document.getElementById('modalTags').innerHTML = tagsHtml || '—';

  const link = item.link || '#';
  const linkEl = document.getElementById('modalLink');
  linkEl.href = link;
  linkEl.textContent = link;

  const sectionCls = item.section === '招标机会' ? 'section-tender' : 'section-news';
  document.getElementById('modalMeta').innerHTML = `
    <span><span class="section-tag ${sectionCls}">${item.section}</span></span>
    <span>📌 ${item.subsection || ''}</span>
    <span>📰 ${item.source || ''}</span>
    <span>📅 ${item.published || ''}</span>
  `;

  document.getElementById('detailModal').classList.add('active');
}

function closeModal() {
  document.getElementById('detailModal').classList.remove('active');
}

// 点击遮罩关闭
document.getElementById('detailModal').addEventListener('click', (e) => {
  if (e.target.id === 'detailModal') closeModal();
});

// ESC 关闭
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

// ==========================================
// 事件绑定
// ==========================================
document.getElementById('filterSection').addEventListener('change', applyFilters);
document.getElementById('filterMinScore').addEventListener('change', applyFilters);
document.getElementById('filterTime').addEventListener('change', applyFilters);
document.getElementById('filterSearch').addEventListener('input', applyFilters);
document.getElementById('sortBy').addEventListener('change', applyFilters);

// ==========================================
// 启动
// ==========================================
loadData();
</script>
