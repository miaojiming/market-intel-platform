name: Export Dashboard Data

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间 8:30 导出（在每日情报之后）
    - cron: '30 0 * * *'

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests --quiet

      - name: Export dashboard data
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          BITABLE_APP_TOKEN: ${{ secrets.BITABLE_APP_TOKEN }}
          BITABLE_TABLE_ID: ${{ secrets.BITABLE_TABLE_ID }}
        run: python scripts/export_dashboard_data.py

      - name: Upload to GitHub Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-data
          path: dashboard/data.json
