name: Daily Intelligence Report

on:
  schedule:
    # 每天北京时间 8:00 运行（UTC 0:00）
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run intelligence pipeline (collect → score → bitable → push)
        env:
          LLM_API_KEY: ${{ secrets.LLM_GATEWAY_API_KEY }}
          LLM_BASE_URL: https://llm-gw.agenzo.com/v1
          LLM_MODEL: kiro/claude-opus-5
          LLM_SCORING_MODEL: kiro/gpt-5.6-sol
          LLM_MAX_RETRIES: '4'
          LLM_RETRY_DELAY: '3'
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          # 多维表格写入需要自建应用身份（需已开通 bitable:app 并被加为 Base 协作者）
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          BITABLE_APP_TOKEN: IjRjbhMNZaCR3YsvenrcIyk2nXg
          BITABLE_TABLE_ID: tblHfzfRCBqjAfVD
        run: |
          python scripts/daily_pipeline.py

      - name: Upload intelligence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-intelligence
          path: output/
          retention-days: 30
